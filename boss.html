<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老板看板 - 数据汇总</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 展开/收起动画 */
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out; }
        .accordion-content.open { max-height: 1000px; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans antialiased text-gray-800">

    <!-- 顶部控制台 -->
    <header class="bg-white shadow-sm sticky top-0 z-30 pt-3 pb-2 px-4 space-y-3">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📊</span>
                <h1 class="text-lg font-bold text-gray-800 tracking-wide">老板看板</h1>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 催单按钮 -->
                <button onclick="checkUnsubmitted()" class="text-xs text-white font-medium px-3 py-1.5 rounded-md bg-orange-500 shadow-sm">🔔 催单</button>
                <button onclick="showPasswordModal()" class="text-xs text-blue-600 font-medium px-2 py-1.5 rounded-md bg-blue-50">改密</button>
                <button onclick="logout()" class="text-xs text-red-500 font-medium px-2 py-1.5 rounded-md bg-red-50">退出</button>
            </div>
        </div>

        <div class="flex items-center space-x-2 overflow-x-auto hide-scrollbar pb-1">
            <div class="relative shrink-0">
                <input type="date" id="datePicker" onchange="loadSummary()" class="pl-8 pr-2 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none"><span class="text-gray-400 text-sm">📅</span></div>
            </div>

            <div class="relative shrink-0">
                <select id="shopSelect" onchange="loadSummary()" class="pl-8 pr-6 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                    <option value="">全部门店</option>
                </select>
                <div class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none"><span class="text-gray-400 text-sm">🏪</span></div>
                <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></div>
            </div>

            <button onclick="resetToAll()" class="shrink-0 bg-gray-100 text-gray-600 px-3 py-2 rounded-lg text-sm font-medium active:bg-gray-200">🔄 全显</button>
            <button onclick="openFilter()" class="shrink-0 bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium active:bg-indigo-700 flex items-center">🎛️ 筛选</button>
        </div>
    </header>

    <!-- 主列表区 -->
    <main id="summaryList" class="flex-1 overflow-y-auto p-4 space-y-3 pb-10">
        <div class="text-center text-gray-400 py-10">加载中...</div>
    </main>

    <!-- 催单弹窗 -->
    <div id="unsubmittedModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-orange-50 shrink-0">
                <h3 class="text-lg font-bold text-orange-600">🔔 未交单提醒</h3>
                <button onclick="closeUnsubmitted()" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-2" id="unsubmittedList">
                <!-- 动态渲染 -->
            </div>
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 shrink-0">
                <button onclick="copyUnsubmitted()" class="w-full bg-orange-500 text-white font-bold py-2 rounded-lg hover:bg-orange-600">📋 复制名单去催单</button>
            </div>
        </div>
    </div>

    <!-- 全屏筛选面板 -->
    <div id="filterPanel" class="fixed inset-0 bg-white z-50 flex flex-col transform translate-y-full transition-transform duration-300">
        <div class="px-4 h-14 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
            <h2 class="text-lg font-bold text-gray-800">选择要查看的商品</h2>
            <button onclick="closeFilter()" class="text-gray-500 text-sm font-medium px-3 py-1.5 bg-gray-100 rounded-md">取消</button>
        </div>
        <div class="px-4 py-2 bg-gray-50 flex space-x-3 border-b border-gray-200 shrink-0">
            <button onclick="selectAllProducts(true)" class="text-xs bg-white border border-gray-300 px-3 py-1.5 rounded shadow-sm">全选</button>
            <button onclick="selectAllProducts(false)" class="text-xs bg-white border border-gray-300 px-3 py-1.5 rounded shadow-sm">全不选</button>
        </div>
        <div id="filterList" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-4 bg-white border-t border-gray-200 shrink-0">
            <button onclick="saveFilter()" class="w-full bg-indigo-600 text-white font-bold text-lg py-3.5 rounded-xl active:bg-indigo-700">保存并查看</button>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">修改密码</h3>
                <button onclick="hidePasswordModal()" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-6 space-y-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">旧密码</label><input type="password" id="oldPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">新密码</label><input type="password" id="newPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label><input type="password" id="confirmPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <p id="pwdErrorMsg" class="text-sm text-red-500 hidden"></p>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
                <button onclick="hidePasswordModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg">取消</button>
                <button id="submitPwdBtn" onclick="submitChangePassword()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg">确认修改</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://my-todo-app-pvd7.onrender.com";
        const token = localStorage.getItem('jwt_token');

        let globalShops = [];
        let allProducts = [];
        let summaryData = [];
        let selectedProductIds = [];
        let unsubmittedNames = []; // 用于保存未交单名单以便复制

        // 鉴权
        if (!token) { window.location.href = 'login.html'; }
        try {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            if (payload.role !== 'boss') { alert("无权访问"); window.location.href = 'login.html'; }
        } catch (e) { window.location.href = 'login.html'; }

        function logout() { localStorage.removeItem('jwt_token'); window.location.href = 'login.html'; }

        async function apiFetch(endpoint) {
            const res = await fetch(`${API_BASE_URL}${endpoint}`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) {
                const d = await res.json();
                throw new Error(d.detail || "网络请求失败");
            }
            return await res.json();
        }

        // 初始化
        window.onload = async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;

            const savedIds = localStorage.getItem('boss_filter_ids');
            if (savedIds) selectedProductIds = JSON.parse(savedIds);

            try {
                globalShops = await apiFetch('/boss/shops');
                const shopSelect = document.getElementById('shopSelect');
                globalShops.forEach(s => shopSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`);

                allProducts = await apiFetch('/products/active');
                if (selectedProductIds.length === 0 && savedIds === null) {
                    selectedProductIds = allProducts.map(p => p.id);
                }

                loadSummary();
            } catch (e) {
                document.getElementById('summaryList').innerHTML = `<div class="text-center text-red-500 mt-10">初始化失败: ${e.message}</div>`;
            }
        };

        // 加载汇总
        async function loadSummary() {
            const date = document.getElementById('datePicker').value;
            const shopId = document.getElementById('shopSelect').value;
            const mainContainer = document.getElementById('summaryList');
            mainContainer.innerHTML = `<div class="text-center text-gray-400 py-10">加载中...</div>`;

            let url = `/boss/daily_summary?query_date=${date}`;
            if (shopId) url += `&shop_id=${shopId}`;

            try {
                const data = await apiFetch(url);
                summaryData = data.summary;
                renderSummary();
            } catch (e) {
                mainContainer.innerHTML = `<div class="text-center text-red-500 py-10">${e.message}</div>`;
            }
        }

        function renderSummary() {
            const mainContainer = document.getElementById('summaryList');
            const displayData = summaryData.filter(item => selectedProductIds.includes(item.product_id));

            if (displayData.length === 0) {
                mainContainer.innerHTML = `<div class="text-center text-gray-400 py-10 bg-white rounded-xl">暂无数据或未勾选任何商品</div>`;
                return;
            }

            mainContainer.innerHTML = displayData.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col mb-2 overflow-hidden">
                    <!-- 汇总头部 (点击展开) -->
                    <div class="p-4 flex items-center justify-between cursor-pointer active:bg-gray-50" onclick="toggleDetail(${item.product_id})">
                        <div class="flex flex-col">
                            <span class="text-base font-bold text-gray-800">${item.product_name}</span>
                            <span class="text-xs text-gray-400 mt-1">单位: ${item.unit} <span class="text-indigo-500 ml-1">▼ 点击展开明细</span></span>
                        </div>
                        <div class="flex space-x-4 text-right">
                            <div class="flex flex-col items-center">
                                <span class="text-[10px] text-gray-500">订货</span>
                                <span class="text-lg font-bold text-blue-600">${item.total_quantity}</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="text-[10px] text-gray-500">退货</span>
                                <span class="text-lg font-bold text-orange-500">${item.total_return}</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="text-[10px] text-gray-500">库存</span>
                                <span class="text-lg font-bold text-green-600">${item.total_stock}</span>
                            </div>
                        </div>
                    </div>
                    <!-- 明细展开区 -->
                    <div id="detail-${item.product_id}" class="accordion-content bg-gray-50 border-t border-gray-100">
                        <div class="p-3 text-sm" id="detailContent-${item.product_id}">
                            加载明细中...
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 展开明细
        async function toggleDetail(productId) {
            const contentDiv = document.getElementById(`detail-${productId}`);
            const innerDiv = document.getElementById(`detailContent-${productId}`);
            
            if (contentDiv.classList.contains('open')) {
                contentDiv.classList.remove('open');
                return;
            }
            contentDiv.classList.add('open');

            // 如果已经加载过就不重复请求
            if (innerDiv.dataset.loaded === "true") return;

            const date = document.getElementById('datePicker').value;
            const shopId = document.getElementById('shopSelect').value;
            let url = `/boss/product_detail?product_id=${productId}&query_date=${date}`;
            if (shopId) url += `&shop_id=${shopId}`;

            try {
                const details = await apiFetch(url);
                if (details.length === 0) {
                    innerDiv.innerHTML = `<div class="text-center text-gray-400 text-xs py-2">暂无具体明细</div>`;
                } else {
                    innerDiv.innerHTML = details.map(d => `
                        <div class="flex justify-between items-center py-2 border-b border-gray-200 last:border-0">
                            <div class="font-medium text-gray-700 w-1/3 truncate">${d.user_name}</div>
                            <div class="flex space-x-3 text-xs w-1/2 justify-end">
                                <span>订:<strong class="text-blue-600">${d.quantity}</strong></span>
                                <span>退:<strong class="text-orange-500">${d.return_quantity}</strong></span>
                                <span>存:<strong class="text-green-600">${d.stock_quantity}</strong></span>
                            </div>
                            <div class="w-1/6 text-right space-x-2">
                                <button onclick="editDetail(${d.id}, ${d.quantity}, ${d.return_quantity}, ${d.stock_quantity})" class="text-blue-500 text-xs">修改</button>
                            </div>
                        </div>
                    `).join('');
                }
                innerDiv.dataset.loaded = "true";
            } catch (e) {
                innerDiv.innerHTML = `<div class="text-center text-red-500 text-xs py-2">加载失败</div>`;
            }
        }

        // 老板直接修改明细
        async function editDetail(orderId, oldQ, oldR, oldS) {
            const q = prompt("修改【订货量】:", oldQ);
            if (q === null) return;
            const r = prompt("修改【退货量】:", oldR);
            if (r === null) return;
            const s = prompt("修改【库存量】:", oldS);
            if (s === null) return;

            try {
                const res = await fetch(`${API_BASE_URL}/boss/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ quantity: parseFloat(q)||0, return_quantity: parseFloat(r)||0, stock_quantity: parseFloat(s)||0 })
                });
                if (!res.ok) throw new Error("修改失败");
                alert("修改成功！");
                loadSummary(); // 刷新总汇总
            } catch (e) { alert(e.message); }
        }

        // ================= 催单功能 =================
        async function checkUnsubmitted() {
            const date = document.getElementById('datePicker').value;
            const shopId = document.getElementById('shopSelect').value;
            let url = `/boss/unsubmitted?query_date=${date}`;
            if (shopId) url += `&shop_id=${shopId}`;

            try {
                const data = await apiFetch(url);
                const listDiv = document.getElementById('unsubmittedList');
                unsubmittedNames = data.unsubmitted.map(u => u.name); // 保存名字

                if (unsubmittedNames.length === 0) {
                    listDiv.innerHTML = `<div class="text-center text-green-600 font-bold py-4">🎉 太棒了，所有店员都已交单！</div>`;
                } else {
                    listDiv.innerHTML = data.unsubmitted.map(u => `
                        <div class="flex justify-between items-center bg-orange-50 text-orange-700 px-3 py-2 rounded-lg text-sm">
                            <span class="font-medium">${u.name}</span>
                            <span class="text-xs opacity-75">${u.shop_name}</span>
                        </div>
                    `).join('');
                }
                document.getElementById('unsubmittedModal').classList.remove('hidden');
                document.getElementById('unsubmittedModal').classList.add('flex');
            } catch (e) { alert(e.message); }
        }

        function closeUnsubmitted() {
            document.getElementById('unsubmittedModal').classList.add('hidden');
            document.getElementById('unsubmittedModal').classList.remove('flex');
        }

        function copyUnsubmitted() {
            if (unsubmittedNames.length === 0) return;
            const text = `【催单提醒】以下店员今日（${document.getElementById('datePicker').value}）尚未交单，请尽快填写：\n` + unsubmittedNames.join('、');
            // 复制到剪贴板
            navigator.clipboard.writeText(text).then(() => {
                alert("名单已复制，快去微信群粘贴催单吧！");
            }).catch(() => {
                alert("复制失败，请手动选中复制");
            });
        }

        // ================= 其它功能 =================
        function resetToAll() {
            document.getElementById('shopSelect').value = "";
            loadSummary();
        }

        const filterPanel = document.getElementById('filterPanel');
        function openFilter() { renderFilterList(); filterPanel.classList.remove('translate-y-full'); }
        function closeFilter() { filterPanel.classList.add('translate-y-full'); }
        function renderFilterList() {
            const container = document.getElementById('filterList');
            const grouped = allProducts.reduce((acc, p) => {
                const cat = p.category || '其它';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(p);
                return acc;
            }, {});

            let html = '';
            for (const [category, products] of Object.entries(grouped)) {
                html += `
                    <div>
                        <h3 class="font-bold text-gray-700 mb-2 border-b pb-1">${category}</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${products.map(p => {
                                const isChecked = selectedProductIds.includes(p.id) ? 'checked' : '';
                                return `<label class="flex items-center space-x-2 bg-gray-50 p-2 rounded border border-gray-100 text-sm active:bg-gray-100">
                                    <input type="checkbox" value="${p.id}" ${isChecked} class="filter-checkbox w-4 h-4 text-indigo-600 rounded">
                                    <span class="truncate text-gray-700">${p.name}</span>
                                </label>`;
                            }).join('')}
                        </div>
                    </div>`;
            }
            container.innerHTML = html;
        }
        function selectAllProducts(isSelectAll) {
            document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = isSelectAll);
        }
        function saveFilter() {
            const newSelectedIds = [];
            document.querySelectorAll('.filter-checkbox').forEach(cb => {
                if (cb.checked) newSelectedIds.push(parseInt(cb.value));
            });
            selectedProductIds = newSelectedIds.length === 0 ? allProducts.map(p => p.id) : newSelectedIds;
            localStorage.setItem('boss_filter_ids', JSON.stringify(selectedProductIds));
            closeFilter();
            renderSummary();
        }

        // 密码修改
        const pwdModal = document.getElementById('passwordModal');
        const pwdErrorMsg = document.getElementById('pwdErrorMsg');
        function showPasswordModal() { document.getElementById('oldPassword').value = ''; document.getElementById('newPassword').value = ''; document.getElementById('confirmPassword').value = ''; pwdErrorMsg.classList.add('hidden'); pwdModal.classList.remove('hidden'); }
        function hidePasswordModal() { pwdModal.classList.add('hidden'); }
        async function submitChangePassword() {
            const oldPwd = document.getElementById('oldPassword').value; const newPwd = document.getElementById('newPassword').value; const confirmPwd = document.getElementById('confirmPassword').value; const btn = document.getElementById('submitPwdBtn');
            if (!oldPwd || !newPwd || !confirmPwd) return showPwdError("请填写完整");
            if (newPwd.length < 6) return showPwdError("新密码至少6位");
            if (newPwd !== confirmPwd) return showPwdError("两次密码不一致");
            btn.disabled = true; btn.textContent = "提交中..."; pwdErrorMsg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/change-password`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }) });
                const data = await res.json();
                if (res.ok) { alert("修改成功，请重新登录"); localStorage.removeItem('jwt_token'); window.location.href = 'login.html'; } else { showPwdError(data.detail || "修改失败"); }
            } catch (error) { showPwdError("网络错误"); } finally { btn.disabled = false; btn.textContent = "确认修改"; }
        }
        function showPwdError(msg) { pwdErrorMsg.textContent = msg; pwdErrorMsg.classList.remove('hidden'); }
    </script>
</body>
</html>
