<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页 - 待办事项</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background-color: #ff4520;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: #000000;
      transition: background-color 0.3s, color 0.3s;
      padding: 20px 15px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .input-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    #todoInput {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    #addBtn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size:16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #addBtn:active {
      opacity:0.8;
    }
    .todo-item {
      background: #fff;
      border-radius: 10px;
      padding:16px;
      margin-bottom:12px;
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap:12px;
    }
    .todo-left {
      display:flex;
      gap:10px;
    }
    .todo-text {
      font-size:17px;
    }
    .todo-time {
      font-size:13px;
      color:#666;
      margin-top:4px;
    }
    .todo-done .todo-text {
      text-decoration: line-through;
      color:#888;
    }
    .del-btn {
      border:none;
      background:#ff3333;
      color:#fff;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      flex-shrink:0;
    }
    /* 移动端适配 */
    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }
      .input-wrap {
        flex-direction: column;
      }
      #addBtn {
        width:100%;
      }
      .todo-item {
        padding:12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办事项</h1>
    <div class="input-wrap">
      <input id="todoInput" type="text" placeholder="输入新的待办...">
      <button id="addBtn">添加</button>
    </div>
    <div id="todoList"></div>
  </div>

  <script>
    // 已经替换成你的Render后端域名
    const API_BASE = "https://my-todo-app-pvd7.onrender.com";

    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');

    // 获取全部待办
    async function fetchTodos() {
      const res = await fetch(`${API_BASE}/todos`);
      const todos = await res.json();
      renderList(todos);
    }

    // 渲染列表
    function renderList(todos) {
      todoList.innerHTML = '';
      todos.forEach(item => {
        const div = document.createElement('div');
        div.className = `todo-item ${item.is_done ? 'todo-done' : ''}`;
        div.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" ${item.is_done ? 'checked' : ''} data-id="${item.id}" class="check-box">
            <div>
              <div class="todo-text">${escapeHtml(item.content)}</div>
              <div class="todo-time">创建：${item.created_at}</div>
            </div>
          </div>
          <button class="del-btn" data-id="${item.id}">删除</button>
        `;
        todoList.appendChild(div);
      })

      // 勾选事件
      document.querySelectorAll('.check-box').forEach(ck => {
        ck.onchange = async function () {
          const id = this.dataset.id;
          await fetch(`${API_BASE}/todos/${id}`, {
            method: "PUT",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({is_done: this.checked})
          })
          fetchTodos();
        }
      })

      // 删除事件
      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async function () {
          const id = this.dataset.id;
          await fetch(`${API_BASE}/todos/${id}`, {method:"DELETE"})
          fetchTodos();
        }
      })
    }

    // 添加待办
    addBtn.onclick = async () => {
      const val = todoInput.value.trim();
      if(!val) return;
      await fetch(`${API_BASE}/todos?content=${encodeURIComponent(val)}`, {method:"POST"});
      todoInput.value = "";
      fetchTodos();
    }
    // 回车添加
    todoInput.onkeydown = e => {
      if(e.key === 'Enter') addBtn.click();
    }

    // 简单防止XSS
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))
    }

    // 页面加载自动拉取
    fetchTodos();
  </script>
</body>
</html>
