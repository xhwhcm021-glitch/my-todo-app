<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background-color: #ff4520;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: #000000;
      transition: background-color 0.3s, color 0.3s;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    /* 顶部导航栏 */
    .navbar {
      padding: 1.5rem 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 3rem;
      list-style: none;
      flex: 1;
    }
    .nav-links a {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .nav-links a:hover {
      opacity: 0.8;
    }
    #night-mode-btn {
      padding: 0.5rem 1rem;
      border: 2px solid #ffffff;
      border-radius: 8px;
      background-color: transparent;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.25s, color 0.25s, transform 0.25s, box-shadow 0.25s;
    }
    #night-mode-btn:hover {
      background-color: #ffffff;
      color: #ff4520;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
    #night-mode-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* 夜间模式 统一样式 */
    body.night-mode {
      background-color: #2d2d2d;
      color: #ffffff;
    }
    body.night-mode .nav-links a,
    body.night-mode .section-title,
    body.night-mode .footer,
    body.night-mode .hero-right h1,
    body.night-mode .hero-right h1 a,
    body.night-mode .hero-right p,
    body.night-mode .article-card h3,
    body.night-mode .article-card p {
      color: #ffffff;
    }
    body.night-mode .hero-card,
    body.night-mode .article-card,
    body.night-mode .todo-card {
      background-color: #3d3d3d;
    }
    body.night-mode #night-mode-btn {
      border-color: #ffffff;
      color: #ffffff;
    }
    body.night-mode #night-mode-btn:hover {
      background-color: #ffffff;
      color: #2d2d2d;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }
    body.night-mode #night-mode-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* 待办事项区 */
    .todo-section {
      padding-bottom: 1rem;
    }
    .todo-card {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 2.5rem;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.08);
      transition: background-color 0.3s;
    }
    .todo-title {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .todo-form {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    #todo-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #eeeeee;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background-color 0.3s, color 0.3s;
    }
    #todo-input:focus {
      border-color: #00c853;
    }
    #todo-add-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 10px;
      background-color: #00c853;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    #todo-add-btn:hover {
      background-color: #00a844;
      transform: translateY(-2px);
    }
    .todo-list {
      list-style: disc;
      padding-left: 1.5rem;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #333333;
      font-size: 1rem;
      line-height: 1.8;
      margin: 6px 0;
    }
    .todo-text {
      cursor: pointer;
      transition: color 0.2s, opacity 0.2s;
    }
    .todo-text:hover {
      color: #00c853;
      opacity: 0.8;
    }
    .todo-text.finish {
      text-decoration: line-through;
      color: #888;
    }
    .todo-del-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      background-color: #ff4444;
      color: #fff;
      cursor: pointer;
      margin-left:12px;
    }
    .todo-del-btn:hover {
      background-color: #dd2222;
    }
    body.night-mode #todo-input {
      background-color: #2d2d2d;
      border-color: #555555;
      color: #ffffff;
    }
    body.night-mode .todo-item {
      color: #ffffff;
    }
    body.night-mode .todo-text:hover {
      color: #69f0ae;
    }
    body.night-mode .todo-text.finish {
      color:#aaa;
    }

    /* 主视觉区卡片 */
    .hero {
      display: flex;
      justify-content: center;
      padding: 2rem 0 3rem;
    }
    .hero-card {
      display: flex;
      align-items: center;
      gap: 3rem;
      padding: 2.5rem;
      max-width: 960px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.08);
      transition: background-color 0.3s;
    }
    .hero-left {
      flex-shrink: 0;
    }
    .hero-photo {
      max-width: 320px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: block;
    }
    .hero-right {
      flex: 1;
      text-align: left;
    }
    .hero-right h1 {
      color: #00c853;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.5;
    }
    .hero-right h1 a {
      color: #00c853;
      text-decoration: underline;
    }
    .hero-right h1 a:hover {
      color: #69f0ae;
    }
    .hero-right p {
      color: #00c632;
      font-size: 1.25rem;
      margin-top: 1rem;
    }

    /* 最新文章区 */
    .articles {
      padding: 1rem 0 4rem;
    }
    .section-title {
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2rem;
    }
    .article-grid {
      display: flex;
      gap: 1.5rem;
    }
    .article-card {
      flex: 1;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, background-color 0.3s;
    }
    .article-card:hover {
      transform: translateY(5px);
    }
    .article-card h3 {
      color: #00c853;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .article-card p {
      color: #666666;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* 底部页脚 */
    .footer {
      text-align: center;
      padding: 2rem 0 2.5rem;
      color: #ffffff;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container">
      <nav class="nav-inner">
        <ul class="nav-links">
          <li><a href="#">首页</a></li>
          <li><a href="#">关于我们</a></li>
          <li><a href="#">我的作品</a></li>
        </ul>
        <button id="night-mode-btn" type="button">夜间模式</button>
      </nav>
    </div>
  </header>

  <section class="todo-section">
    <div class="container">
      <div class="todo-card">
        <h2 class="section-title todo-title">待办事项</h2>
        <div class="todo-form">
          <input type="text" id="todo-input" placeholder="输入待办内容...">
          <button id="todo-add-btn" type="button">添加</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
      </div>
    </div>
  </section>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-card">
          <div class="hero-left">
            <img class="hero-photo" src="微信图片_20260130134308_15_2.jpg" alt="个人照片">
          </div>
          <div class="hero-right">
            <h1>你好，这是<a href="https://www.baidu.com" target="_blank">我</a>做的一个网页。</h1>
            <p>我正在学习全栈开发</p>
          </div>
        </div>
      </div>
    </section>

    <section class="articles">
      <div class="container">
        <h2 class="section-title">最新文章</h2>
        <div class="article-grid">
          <article class="article-card">
            <h3>我的第一个网页</h3>
            <p>记录从零开始学习 HTML 和 CSS 的过程，完成了第一个属于自己的网页作品。</p>
          </article>
          <article class="article-card">
            <h3>Flexbox 布局入门</h3>
            <p>学习了 Flexbox 弹性布局，实现了左右两栏排版和页面垂直居中效果。</p>
          </article>
          <article class="article-card">
            <h3>AI 辅助编程体验</h3>
            <p>尝试用 AI 工具辅助写代码，大大提高了学习效率和页面美化速度。</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>@2026我的个人主页</p>
    </div>
  </footer>

  <script>
    // 夜间模式切换
    const nightModeBtn = document.getElementById('night-mode-btn');
    nightModeBtn.addEventListener('click', function () {
      document.body.classList.toggle('night-mode');
    });

    // 待办事项
    const todoInput = document.getElementById('todo-input');
    const todoAddBtn = document.getElementById('todo-add-btn');
    const todoList = document.getElementById('todo-list');

    // 从本地存储读取数据
    function getTodos() {
      const data = localStorage.getItem('todos');
      return data ? JSON.parse(data) : [];
    }
    // 保存到本地存储
    function saveTodos(list) {
      localStorage.setItem('todos', JSON.stringify(list));
    }

    // 渲染待办列表
    function renderTodos() {
      todoList.innerHTML = '';
      const todos = getTodos();
      todos.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'todo-item';

        const spanText = document.createElement('span');
        spanText.className = 'todo-text' + (item.done ? ' finish' : '');
        spanText.textContent = item.text;

        // 点击文字切换完成状态
        spanText.addEventListener('click', () => {
          todos[index].done = !todos[index].done;
          saveTodos(todos);
          renderTodos();
        })

        // 删除按钮
        const delBtn = document.createElement('button');
        delBtn.className = 'todo-del-btn';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          todos.splice(index,1);
          saveTodos(todos);
          renderTodos();
        })

        li.appendChild(spanText);
        li.appendChild(delBtn);
        todoList.appendChild(li);
      })
    }

    // 添加待办
    function addTodo() {
      const text = todoInput.value.trim();
      if (!text) return;
      const todos = getTodos();
      todos.push({text, done:false});
      saveTodos(todos);
      renderTodos();
      todoInput.value = '';
    }

    todoAddBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter') addTodo();
    });

    // 页面加载渲染
    renderTodos();
  </script>
</body>
</html>
