<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订货系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 h-screen flex items-center justify-center font-sans antialiased text-gray-800">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-600 tracking-tight">订货系统</h1>
            <p class="text-gray-400 text-sm mt-2">请使用您的账号登录系统</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">账号</label>
                <input type="text" id="username" value="admin" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="请输入账号">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" id="password" value="123456" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="请输入密码">
            </div>
            
            <p id="msg" class="text-sm text-red-500 font-medium hidden text-center"></p>

            <button id="loginBtn" onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold text-lg py-3.5 rounded-xl hover:bg-blue-700 active:bg-blue-800 transition-colors disabled:bg-gray-400 mt-4 shadow-lg shadow-blue-500/30">
                登 录
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://my-todo-app-pvd7.onrender.com";

        // 监听回车键登录
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const name = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('msg');
            const btn = document.getElementById('loginBtn');
            
            if (!name || !password) {
                msgDiv.textContent = "请输入账号和密码";
                msgDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "登录中...";
            msgDiv.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('jwt_token', data.access_token);
                    localStorage.setItem('user_role', data.role); // 顺便存一下角色方便后续使用

                    // 解析 JWT 获取角色
                    const token = data.access_token;
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const payload = JSON.parse(window.atob(base64));
                    const role = payload.role;

                    // 根据角色跳转
                    if (role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (role === 'boss') {
                        window.location.href = 'boss.html';
                    } else if (role === 'staff') {
                        window.location.href = 'store.html';
                    } else {
                        alert('未知角色，无对应页面');
                    }
                } else {
                    msgDiv.textContent = data.detail || "账号或密码错误";
                    msgDiv.classList.remove('hidden');
                }
            } catch (error) {
                msgDiv.textContent = "网络错误，请稍后重试";
                msgDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "登 录";
            }
        }
    </script>
</body>
</html>
