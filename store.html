<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订货系统 - 店员端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .category-tab.active { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans antialiased text-gray-800">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="px-4 h-14 flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-800 tracking-wide">订货单</h1>
            <div class="flex items-center space-x-3">
                <button onclick="showPasswordModal()" class="text-sm text-blue-600 font-medium px-3 py-1.5 rounded-md active:bg-blue-50">改密</button>
                <button onclick="logout()" class="text-sm text-red-500 font-medium px-3 py-1.5 rounded-md active:bg-red-50">退出</button>
            </div>
        </div>
        
        <!-- 搜索框 -->
        <div class="px-4 pb-3">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" oninput="renderList()" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 sm:text-sm transition-all" placeholder="搜索商品名称...">
            </div>
        </div>

        <!-- 分类滚动栏 -->
        <div class="px-4 pb-3 overflow-x-auto whitespace-nowrap hide-scrollbar">
            <div id="categoryTabs" class="flex space-x-2">
                <!-- JS 动态生成 -->
            </div>
        </div>
    </header>

    <!-- 商品列表 -->
    <main id="productList" class="flex-1 overflow-y-auto px-4 pt-4 pb-28 space-y-3">
        <div class="text-center text-gray-400 py-10">加载中...</div>
    </main>

    <!-- 底部提交按钮 -->
    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-30">
        <button id="submitBtn" onclick="submitOrders()" class="w-full bg-blue-600 text-white font-bold text-lg py-3.5 rounded-xl active:bg-blue-700 transition-colors disabled:bg-gray-400">
            提交订单
        </button>
    </footer>

    <!-- 密码弹窗 (略去重复的头部) -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">修改密码</h3>
                <button onclick="hidePasswordModal()" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-6 space-y-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">旧密码</label><input type="password" id="oldPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">新密码</label><input type="password" id="newPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label><input type="password" id="confirmPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                <p id="pwdErrorMsg" class="text-sm text-red-500 hidden"></p>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
                <button onclick="hidePasswordModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg">取消</button>
                <button id="submitPwdBtn" onclick="submitChangePassword()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg">确认修改</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://my-todo-app-pvd7.onrender.com";
        const token = localStorage.getItem('jwt_token');

        if (!token) { window.location.href = 'login.html'; }
        try {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            if (payload.role !== 'staff') { alert("无权访问"); window.location.href = 'login.html'; }
        } catch (e) { window.location.href = 'login.html'; }

        function logout() { localStorage.removeItem('jwt_token'); window.location.href = 'login.html'; }

        async function authFetch(endpoint, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${token}`;
            const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('jwt_token'); window.location.href = 'login.html'; return;
            }
            return response;
        }

        // ================= 核心渲染逻辑 =================
        let allProducts = [];
        let currentCategory = '全部';

        // 1. 初始化数据
        async function loadProducts() {
            try {
                const response = await authFetch('/products/active');
                if (!response.ok) throw new Error("获取失败");
                allProducts = await response.json();
                
                // 提取分类
                const categories = ['全部', ...new Set(allProducts.map(p => p.category || '其它'))];
                const tabsContainer = document.getElementById('categoryTabs');
                tabsContainer.innerHTML = categories.map(cat => `
                    <button onclick="switchCategory('${cat}')" class="category-tab ${cat === '全部' ? 'active' : 'bg-gray-100 text-gray-600'} px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors">
                        ${cat}
                    </button>
                `).join('');

                renderList();
            } catch (error) {
                document.getElementById('productList').innerHTML = `<div class="text-center text-red-500 py-10">加载失败</div>`;
            }
        }

        // 2. 切换分类
        function switchCategory(cat) {
            currentCategory = cat;
            // 更新 UI 高亮
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
                if (btn.textContent.trim() === cat) {
                    btn.classList.add('active', 'bg-blue-600', 'text-white');
                    btn.classList.remove('bg-gray-100', 'text-gray-600');
                }
            });
            renderList();
        }

        // 3. 渲染列表
        function renderList() {
            const keyword = document.getElementById('searchInput').value.trim();
            const mainContainer = document.getElementById('productList');
            
            // 过滤数据
            const filtered = allProducts.filter(p => {
                const matchCategory = currentCategory === '全部' || (p.category || '其它') === currentCategory;
                const matchKeyword = p.name.includes(keyword);
                return matchCategory && matchKeyword;
            });

            if (filtered.length === 0) {
                mainContainer.innerHTML = `<div class="text-center text-gray-400 py-10">没有找到相关商品</div>`;
                return;
            }

            // 渲染卡片
            mainContainer.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 flex flex-col space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-base font-bold text-gray-800">${p.name}</span>
                        <span class="text-xs text-gray-400">单位: ${p.unit}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-center text-gray-500 mb-1">订货量</label>
                            <input type="number" min="0" step="any" data-id="${p.id}" data-field="quantity" placeholder="-" class="input-qty w-full h-10 text-center font-bold text-blue-600 bg-blue-50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-center text-gray-500 mb-1">退货量</label>
                            <input type="number" min="0" step="any" data-id="${p.id}" data-field="return_quantity" placeholder="-" class="input-return w-full h-10 text-center font-bold text-orange-500 bg-orange-50 border border-orange-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-center text-gray-500 mb-1">库存量</label>
                            <input type="number" min="0" step="any" data-id="${p.id}" data-field="stock_quantity" placeholder="-" class="input-stock w-full h-10 text-center font-bold text-green-600 bg-green-50 border border-green-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ================= 提交逻辑 =================
        async function submitOrders() {
            const inputs = document.querySelectorAll('input[type="number"]');
            const orderMap = {}; // 用 Map 来汇总同一个商品的数据

            inputs.forEach(input => {
                const val = parseFloat(input.value);
                if (val > 0) {
                    const id = input.dataset.id;
                    const field = input.dataset.field;
                    if (!orderMap[id]) orderMap[id] = { product_id: parseInt(id), quantity: 0, return_quantity: 0, stock_quantity: 0 };
                    orderMap[id][field] = val;
                }
            });

            const orderItems = Object.values(orderMap);

            if (orderItems.length === 0) return alert("请至少填写一个数量");

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true; submitBtn.textContent = "提交中...";

            try {
                const response = await authFetch('/orders/batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderItems)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "提交失败");
                
                alert(data.message || "提交成功！");
                // 清空已填写的数量
                inputs.forEach(input => input.value = '');

            } catch (error) {
                alert(error.message);
            } finally {
                submitBtn.disabled = false; submitBtn.textContent = originalText;
            }
        }

        // ================= 修改密码 =================
        const pwdModal = document.getElementById('passwordModal');
        const pwdErrorMsg = document.getElementById('pwdErrorMsg');
        function showPasswordModal() { document.getElementById('oldPassword').value = ''; document.getElementById('newPassword').value = ''; document.getElementById('confirmPassword').value = ''; pwdErrorMsg.classList.add('hidden'); pwdModal.classList.remove('hidden'); }
        function hidePasswordModal() { pwdModal.classList.add('hidden'); }
        async function submitChangePassword() {
            const oldPwd = document.getElementById('oldPassword').value; const newPwd = document.getElementById('newPassword').value; const confirmPwd = document.getElementById('confirmPassword').value; const btn = document.getElementById('submitPwdBtn');
            if (!oldPwd || !newPwd || !confirmPwd) return showPwdError("请填写完整");
            if (newPwd.length < 6) return showPwdError("新密码至少6位");
            if (newPwd !== confirmPwd) return showPwdError("两次密码不一致");
            btn.disabled = true; btn.textContent = "提交中..."; pwdErrorMsg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/change-password`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }) });
                const data = await res.json();
                if (res.ok) { alert("修改成功，请重新登录"); localStorage.removeItem('jwt_token'); window.location.href = 'login.html'; } else { showPwdError(data.detail || "修改失败"); }
            } catch (error) { showPwdError("网络错误"); } finally { btn.disabled = false; btn.textContent = "确认修改"; }
        }
        function showPwdError(msg) { pwdErrorMsg.textContent = msg; pwdErrorMsg.classList.remove('hidden'); }

        window.onload = loadProducts;
    </script>
</body>
</html>
